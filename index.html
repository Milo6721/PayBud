<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f9d76">
<title>PayBud — rozliczaj się bez kłótni</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f9d76'/%3E%3Cpath d='M20 44V20h13a8 8 0 0 1 0 16H26' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  :root{
    --bg:#f4f5fb; --card:#fff; --ink:#181425; --muted:#6f6c85; --line:#e7e6f2;
    --acc:#0f9d76; --acc-d:#0b7d5d; --acc-l:#e3f6ef;
    --p1:#7c3aed; --p2:#ec4899; --p3:#f59e0b; --p4:#0ea5e9;
    --bad:#e0405e; --bad-l:#fde9ee; --warn:#c2760a; --warn-l:#fff4de;
    --r:18px; --shadow:0 1px 2px rgba(24,20,37,.05),0 8px 24px rgba(24,20,37,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{color:var(--ink);background:var(--bg);min-height:100vh;font-size:15px;line-height:1.4}
  body.noscroll{overflow:hidden}
  #app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
  button:disabled{opacity:.55;cursor:not-allowed}
  input,select,textarea{font:inherit;color:inherit;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none;transition:border-color .15s}
  input:focus,select:focus,textarea:focus{border-color:var(--acc)}
  input[type=checkbox]{width:20px;height:20px;padding:0;accent-color:var(--acc)}
  small,.small{font-size:12.5px}
  .muted{color:var(--muted)}
  .center{text-align:center;padding:60px 20px}
  .center-col{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
  .stack{display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:10px;align-items:center}
  .row>*{flex:1}
  .row.wrap{flex-wrap:wrap}
  .pos{color:var(--acc-d);font-weight:700}
  .neg{color:var(--bad);font-weight:700}
  .big{font-size:26px;display:block;letter-spacing:-.02em}

  /* karty i listy */
  .page{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
  .card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
  .card.attn{background:var(--warn-l);box-shadow:none;border:1px solid #f1d9a2}
  .card.balance{color:#fff;font-size:17px;font-weight:600;box-shadow:0 10px 24px rgba(0,0,0,.14)}
  .card.balance .pos,.card.balance .neg{color:#fff}
  .card.balance .muted{color:rgba(255,255,255,.85);font-weight:400;margin-top:6px}
  .card.invite{display:flex;flex-direction:column;gap:12px;border:1.5px solid #f0d9ff;background:linear-gradient(135deg,#faf5ff,#fff)}
  .list{display:flex;flex-direction:column;gap:10px}
  .attn .list{margin-top:10px}
  .empty{text-align:center;color:var(--muted);padding:40px 16px}
  .sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 2px 0}
  .notice{background:var(--acc-l);color:#0b5c45;padding:12px 14px;border-radius:12px;font-size:14px}
  .notice .link{display:block;margin-top:6px}
  .row-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px}
  .row-item:not(.card){background:#fff;border-radius:12px;box-shadow:var(--shadow)}
  .row-item.card{border-radius:var(--r)}

  /* grupy — karty z kolorowym banerem */
  .group-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:10px;transition:transform .12s}
  .group-card:active{transform:scale(.98)}
  .gc-cover{width:56px;height:56px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.12)}
  .gc-icon{font-size:26px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
  .gc-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .gc-bal{font-size:14px}
  .ri-main{flex:1;min-width:0}
  .ri-title{font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .ri-sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .ri-side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
  .ri-amt{font-weight:700;font-variant-numeric:tabular-nums}
  .need{margin-top:6px;font-size:12.5px;font-weight:600;color:var(--warn)}

  .chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap}
  .chip.ok{background:var(--acc-l);color:var(--acc-d)}
  .chip.bad{background:var(--bad-l);color:var(--bad)}
  .chip.warn{background:var(--warn-l);color:var(--warn)}
  .chip.pick{cursor:pointer;padding:6px 12px;font-size:13px;border:1.5px solid var(--line);background:#fff}
  .chip.pick.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:6px}

  /* przyciski */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;transition:background .15s,transform .05s}
  .btn:hover{background:var(--acc-d)}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  .btn.ghost:hover{background:#f7faf9}
  .btn.danger{background:var(--bad)}
  .btn.small{padding:8px 13px;font-size:13.5px;border-radius:10px}
  .btn.wide{width:100%}
  .danger-t{color:var(--bad)!important}
  .link{color:var(--acc-d);font-weight:600;font-size:14px;text-align:center;padding:6px}
  label.btn input{display:none}

  /* topbar / nawigacja */
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));background:rgba(244,245,251,.92);backdrop-filter:blur(10px)}
  .topbar .title{flex:1;font-size:19px;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .icon-btn{width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
  .icon-btn:hover{background:rgba(24,20,37,.06)}
  .topbar-cover{padding-bottom:34px;margin-bottom:-22px;border-radius:0 0 26px 26px;box-shadow:0 6px 20px rgba(0,0,0,.1)}
  .topbar-cover .title.on-cover{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.2)}
  .icon-btn.on-cover{color:#fff}
  .icon-btn.on-cover:hover{background:rgba(255,255,255,.2)}
  .avatar-btn{border-radius:50%;padding:0;line-height:0}
  .avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;object-fit:cover;color:#fff;font-weight:700;flex-shrink:0}
  .tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:30}
  .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--muted);font-size:11.5px;font-weight:600}
  .tabs button.on{color:var(--acc-d)}
  .fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(76px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(15,157,118,.45);z-index:31}
  .fab:active{transform:scale(.95)}

  /* auth */
  .auth{max-width:420px;margin:0 auto;padding:56px 20px 30px;display:flex;flex-direction:column;gap:16px}
  .logo{font-size:40px;font-weight:800;letter-spacing:-.04em;text-align:center;background:linear-gradient(135deg,var(--p1),var(--p2),var(--p3));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{text-align:center;color:var(--muted);margin-top:-8px}
  .seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px;margin-bottom:6px}
  .seg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13.5px}
  .field span small{font-weight:400;color:var(--muted)}
  .auth-foot{text-align:center;font-size:13px;padding-top:6px}
  .auth-foot a{color:var(--acc-d);font-weight:600;text-decoration:none}
  .auth-foot a:hover{text-decoration:underline}

  /* grupa */
  .transfer{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
  .tf-who{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600;text-align:center}
  .tf-mid{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--acc-d)}
  .tf-act{grid-column:1/-1;text-align:center}
  .member{display:flex;flex-direction:column;gap:10px}
  .mem-top{display:flex;align-items:center;gap:12px}
  .switch-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .switch-row input{width:22px;height:22px;flex-shrink:0}
  .check{display:flex;align-items:center;gap:10px;padding:8px 2px;font-weight:500}
  .check.amt input{width:110px;margin-left:auto;text-align:right}
  .check span{flex:1}
  .feat{padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
  .scan-btn{margin-bottom:12px}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(10,20,16,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
  .sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:up .28s cubic-bezier(.2,.9,.3,1)}
  .sheet h3{font-size:20px;letter-spacing:-.01em}
  .modal-text{font-size:16px}
  .big-amt{font-size:32px;font-weight:800;letter-spacing:-.03em}
  .big-amt small{font-size:14px;color:var(--muted);font-weight:500}
  .shares{display:flex;flex-direction:column;gap:2px}
  .share{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;padding:9px 0;border-bottom:1px solid var(--line)}
  .share-r{display:flex;align-items:center;gap:8px}
  .reason{flex-basis:100%;color:var(--bad);font-size:13px;font-style:italic}
  .receipt{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:var(--bg)}
  .scan-list{display:flex;flex-direction:column;gap:12px}
  .scan-item{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .si-top{display:flex;align-items:center;gap:8px}
  .si-name{flex:1;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis}
  .si-top input{width:90px;text-align:right;padding:8px 10px}
  .scan-total{text-align:right;font-size:17px}
  .spinner{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;margin:20px 0 6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fade{from{opacity:0}}
  @keyframes up{from{transform:translateY(40px);opacity:.6}}

  #toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#13201b;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;max-width:min(90vw,440px);text-align:center;z-index:200;opacity:0;pointer-events:none;transition:all .3s}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.err{background:var(--bad)}

  @media (min-width:560px){ .overlay{align-items:center} .sheet{border-radius:22px} }
</style>
</head>
<body>
<div id="app"><div class="center muted">Ładowanie…</div></div>
<div id="modal-root"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
